name: Crawl Baustellen Data

on:
  schedule:
    - cron: '*/30 * * * *'  # every 30 minutes
  workflow_dispatch:
    inputs:
      gemarkung:
        description: 'Gemarkung ID (e.g. 460). Leave empty for automatic batch selection.'
        required: false
        type: string
      flur:
        description: 'Flur number (e.g. 414). Requires gemarkung.'
        required: false
        type: string
      flurstueck:
        description: 'Flurstueck (e.g. 1/3). Requires gemarkung and flur.'
        required: false
        type: string
      batch_size:
        description: 'Parcels to fetch this run. Empty uses the scheduled default.'
        required: false
        type: string

concurrency:
  group: crawl

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: |
          ARGS=""
          if [ -n "${{ inputs.gemarkung }}" ]; then
            ARGS="--gemarkung ${{ inputs.gemarkung }}"
            if [ -n "${{ inputs.flur }}" ]; then
              ARGS="$ARGS --flur ${{ inputs.flur }}"
              if [ -n "${{ inputs.flurstueck }}" ]; then
                ARGS="$ARGS --flurstueck ${{ inputs.flurstueck }}"
              fi
            fi
          fi
          uv run --no-cache python -u src/crawl.py $ARGS
        env:
          PYTHONUNBUFFERED: "1"
          # src/scraper.py paces requests three seconds apart, so concurrency only
          # decides how many wait in line; the batch size sets the run's length.
          # Measured on the runner: 250 parcels took 22m40s and lost 10% to the
          # register's 500s, against 7.5% at 40 - a steady rate throughout, not a
          # cliff. 200 keeps a run near 18 minutes, comfortably inside the
          # half-hourly schedule, and failures are retried by a later run anyway.
          CRAWL_CONCURRENCY: "12"
          CRAWL_BATCH_SIZE: ${{ inputs.batch_size || '200' }}
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/baustellen.json data/parcels_metadata.json debug/unexpected*.html
          git diff --cached --quiet || git commit -m "chore: update baustellen data $(date -u +%Y-%m-%d\ %H:%M:%S\ UTC)"
          git stash
          git pull --rebase
          git push

  # A push made with GITHUB_TOKEN never triggers another workflow, so the crawl's
  # data commit cannot wake Refresh Map Data on its own - the map served 06:52
  # data for hours while the crawler kept committing. Call it instead.
  refresh-map:
    needs: crawl
    permissions:
      contents: write
    uses: ./.github/workflows/map-data.yml
