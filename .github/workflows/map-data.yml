name: Refresh Map Data

# Cloudflare deploys the Worker itself on every push, but its builder only runs
# npm — it cannot resolve parcels against Frankfurt's ALKIS service. So this
# workflow regenerates the map payload whenever the crawl data changes and
# commits it; that commit is what triggers the Cloudflare build.

on:
  push:
    branches: [main]
    paths:
      - 'data/baustellen.json'
      - 'src/build_site_data.py'
  workflow_dispatch:

concurrency:
  group: refresh-map-data

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4

      - run: uv run --no-cache python -u src/build_site_data.py
        env:
          PYTHONUNBUFFERED: "1"

      - name: Commit refreshed payload
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/public/data
          git diff --cached --quiet || git commit -m "chore: refresh map payload from ALKIS"
          git pull --rebase
          git push
