name: Refresh Map Data

# Cloudflare deploys the Worker itself on every push, but its builder only runs
# npm — it cannot resolve parcels against Frankfurt's ALKIS service. So this
# workflow regenerates the map payload and commits it; that commit is what
# triggers the Cloudflare build.

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'src/build_site_data.py'
  workflow_dispatch:

concurrency:
  group: refresh-map-data

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The caller's SHA predates the data commit the crawl just pushed, so the
      # payload has to be built from the tip rather than from the triggering ref.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: astral-sh/setup-uv@v4

      - run: uv run --no-cache python -u src/build_site_data.py
        env:
          PYTHONUNBUFFERED: "1"

      - name: Commit refreshed payload
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/public/data
          if git diff --cached --quiet; then
            echo "payload unchanged"
            exit 0
          fi
          git commit -m "chore: refresh map payload from ALKIS"
          # --autostash: the crawler may have committed meanwhile, and uv leaves
          # build artefacts in the tree that would otherwise block the rebase.
          git pull --rebase --autostash
          git push
